# T-05: monthly external link check (fails, and emails, if links are gone).
name: linkcheck
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: python3 scripts/linkcheck.py
