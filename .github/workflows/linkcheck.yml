# T-05: monthly external link check (fails, and emails, if links are gone).
name: linkcheck
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/linkcheck.py
