# T-02: run scripts/check.sh on every push and PR; on main, also verify the
# deploy (wait until /healthz reports the new commit) and run the live smoke test.
name: check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: go
        run: echo "version=$(sed -n 's/^go = "\([0-9.]*\)".*/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ steps.go.outputs.version }}
      - run: scripts/check.sh
  deploy-verify:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Wait for the VM to deploy this commit (up to 8 min)
        run: |
          want="${GITHUB_SHA:0:7}"
          for i in $(seq 1 48); do
            got=$(curl -fsS --max-time 10 https://cptx.ee/healthz | python3 -c 'import sys,json;print(json.load(sys.stdin)["commit"])' || true)
            echo "attempt $i: live=$got want=$want"
            case "$got" in "$want"*) exit 0 ;; esac   # may carry a "-dirty" suffix
            sleep 10
          done
          echo "::error::cptx.ee did not deploy $want (safe deploy may have kept the previous version — check journalctl --user -u cptx-ee-deploy)"
          exit 1
      - run: scripts/smoke.sh https://cptx.ee "$GITHUB_SHA"
  lighthouse:
    # T-08: scores for four live pages after each verified deploy (informational)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy-verify
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Lighthouse
        run: |
          { echo "### Lighthouse — cptx.ee @ ${GITHUB_SHA:0:7}"; echo; scripts/lighthouse.sh https://cptx.ee; } | tee -a "$GITHUB_STEP_SUMMARY"
  newsletter:
    # Hands newly published issues to Buttondown (once each, per language) after
    # the deploy is verified, so every link in the email already works.
    # Repository variable NEWSLETTER_MODE: send (sends at once) or draft (default).
    # Does nothing until the BUTTONDOWN_API_KEY secret exists.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy-verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: newsletter
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Issues → Buttondown
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          NEWSLETTER_MODE: ${{ vars.NEWSLETTER_MODE || 'draft' }}
        shell: bash  # -eo pipefail: a failure isn't hidden by tee
        run: python3 scripts/newsletter-send.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
