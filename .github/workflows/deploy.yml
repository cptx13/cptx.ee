name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@master
        with:
          host: cptx
          username: exedev
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /home/exedev/cptx-v2
            git pull origin main
            go build -o cptx.ee .
            systemctl --user restart cptx
